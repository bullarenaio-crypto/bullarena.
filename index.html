<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bull Protocol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: flex-start;
      align-items: stretch;
      overflow-x: hidden;
    }

    /* 1. SPLASH SCREEN (7 SEGUNDOS) - 100% PRETO COM RECORTE DINÂMICO */
    #splash-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .splash-glow {
      position: absolute;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.22) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }

    #splash-canvas {
      position: relative;
      width: 300px;
      max-width: 85vw;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.8));
    }

    /* 2. SIDEBAR BULL PROTOCOL */
    #sidebar-container {
      width: 320px;
      min-height: 100vh;
      background: #040711;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 18px 20px 18px;
      border-right: 1px solid rgba(0, 240, 255, 0.08);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      overflow: hidden;
    }

    #sidebar-container.active {
      opacity: 1;
      visibility: visible;
    }

    /* TOPO: LOGO */
    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .brand-logo-canvas {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px #00f0ff);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #ffffff;
      line-height: 1;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.38em;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* MENU DE NAVEGAÇÃO */
    .nav-group {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      background: transparent;
      border: 1px solid transparent;
    }

    /* ITEM ROOMS SELECIONADO COM GRADIENTE NEON */
    .nav-btn.selected {
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.35) 0%, rgba(34, 211, 238, 0.35) 100%);
      border: 1px solid rgba(34, 211, 238, 0.6);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.25);
    }

    .nav-btn.selected .nav-icon svg {
      stroke: #22d3ee;
      filter: drop-shadow(0 0 6px #22d3ee);
    }

    .nav-btn.selected .btn-title {
      color: #ffffff;
      font-weight: 800;
    }

    .nav-btn:not(.selected):hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-icon svg {
      width: 100%;
      height: 100%;
      stroke: #64748b;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.2s ease;
    }

    .nav-btn:not(.selected):hover .nav-icon svg {
      stroke: #cbd5e1;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
    }

    .btn-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #e2e8f0;
      text-transform: uppercase;
    }

    .btn-subtitle {
      font-size: 11px;
      color: #64748b;
      margin-top: 1px;
    }

    /* CARD DE REGRAS INFERIOR */
    .card-wrapper {
      position: relative;
      z-index: 2;
      margin-top: 18px;
    }

    .rules-box {
      background: rgba(8, 12, 22, 0.95);
      border: 1px solid rgba(34, 211, 238, 0.25);
      border-radius: 18px;
      padding: 18px 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 2;
    }

    .card-logo-canvas {
      width: 36px;
      height: 36px;
      object-fit: contain;
      margin: 0 auto 6px auto;
      filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.8));
    }

    .rule-title-cyan {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #22d3ee;
      display: block;
      text-transform: uppercase;
    }

    .rule-title-purple {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #c084fc;
      display: block;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .rule-desc {
      font-size: 11px;
      line-height: 1.45;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    .btn-how-it-works {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(34, 211, 238, 0.5);
      border-radius: 10px;
      padding: 9px 0;
      color: #22d3ee;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.25s ease;
    }

    .btn-how-it-works:hover {
      background: rgba(34, 211, 238, 0.15);
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.35);
      border-color: #22d3ee;
    }

    /* ONDAS NEON DO RODAPÉ */
    .neon-waves {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 110px;
      background: url('https://i.postimg.cc/4yNtpNzv/site.png') no-repeat bottom center;
      background-size: cover;
      opacity: 0.65;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- 1. SPLASH SCREEN: TOURO ISOLADO NO CANVAS SEM FUNDO/QUADRADO -->
  <div id="splash-screen">
    <div class="splash-glow"></div>
    <canvas id="splash-canvas"></canvas>
  </div>

  <!-- 2. SIDEBAR BULL PROTOCOL -->
  <aside id="sidebar-container">
    
    <div>
      <!-- HEADER COM LOGO RECORTADO E NOME -->
      <div class="brand-section">
        <canvas id="brand-canvas" class="brand-logo-canvas"></canvas>
        <div class="brand-text">
          <div class="brand-title">BULL</div>
          <div class="brand-subtitle">PROTOCOL</div>
        </div>
      </div>

      <!-- ITENS DE MENU -->
      <nav class="nav-group">
        
        <!-- ROOMS (ATIVO) -->
        <div class="nav-btn selected" onclick="selectNav(this)">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24">
              <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" />
              <line x1="13" y1="19" x2="19" y2="13" />
              <line x1="16" y1="16" x2="20" y2="20" />
              <line x1="19" y1="21" x2="21" y2="19" />
              <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5" />
              <line x1="5" y1="14" x2="9" y2="18" />
              <line x1="7" y1="17" x2="4" y2="20" />
              <line x1="3" y1="19" x2="5" y2="21" />
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">ROOMS</span>
            <span class="btn-subtitle">Join battles</span>
          </div>
        </div>

        <!-- LAUNCHPAD (NOVO ITEM) -->
        <div class="nav-btn" onclick="selectNav(this)">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24">
              <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
              <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
              <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
              <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">LAUNCHPAD</span>
            <span class="btn-subtitle">New token drops</span>
          </div>
        </div>

        <!-- MY PROFILE -->
        <div class="nav-btn" onclick="selectNav(this)">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">MY PROFILE</span>
            <span class="btn-subtitle">Wallet and history</span>
          </div>
        </div>

        <!-- RANKING -->
        <div class="nav-btn" onclick="selectNav(this)">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24">
              <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
              <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
              <path d="M4 22h16" />
              <path d="M10 14.66V17c0 .55-.45 1-1 1H7" />
              <path d="M14 14.66V17c0 .55.45 1 1 1h2" />
              <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">RANKING</span>
            <span class="btn-subtitle">Top traders</span>
          </div>
        </div>

        <!-- REWARDS -->
        <div class="nav-btn" onclick="selectNav(this)">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="6" />
              <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11" />
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">REWARDS</span>
            <span class="btn-subtitle">XP and achievements</span>
          </div>
        </div>

        <!-- SETTINGS -->
        <div class="nav-btn" onclick="selectNav(this)">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">SETTINGS</span>
            <span class="btn-subtitle">Preferences</span>
          </div>
        </div>

      </nav>
    </div>

    <!-- CARD INFERIOR E ONDAS -->
    <div class="card-wrapper">
      <div class="rules-box">
        <canvas id="card-canvas" class="card-logo-canvas"></canvas>
        <span class="rule-title-cyan">MORE MOMENTUM</span>
        <span class="rule-title-purple">LESS EMOTION</span>
        <p class="rule-desc">
          The rule is simple: whoever loses market volume in 30 minutes pays the other side.
        </p>
        <button class="btn-how-it-works">HOW IT WORKS?</button>
      </div>

      <div class="neon-waves"></div>
    </div>

  </aside>

  <script>
    const BULL_URL = 'https://i.postimg.cc/kXMHjQJ2/bull-logo-png.png';

    // FUNÇÃO QUE RECORTA MATEMATICAMENTE QUALQUER FUNDO ESCURO/QUADRADO
    function drawCroppedBull(canvasId, img) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      for (let i = 0; i < data.length; i += 4) {
        const brightness = Math.max(data[i], data[i + 1], data[i + 2]);
        if (brightness < 35) {
          data[i + 3] = 0; // Transparência total no quadrado preto
        } else if (brightness < 70) {
          data[i + 3] = Math.round(((brightness - 35) / 35) * 255); // Suavização nas bordas neon
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // CARREGA A IMAGEM E APLICA NOS TRÊS LOCAIS (SPLASH, HEADER E CARD)
    const baseImg = new Image();
    baseImg.crossOrigin = 'anonymous';
    baseImg.src = BULL_URL;
    baseImg.onload = () => {
      drawCroppedBull('splash-canvas', baseImg);
      drawCroppedBull('brand-canvas', baseImg);
      drawCroppedBull('card-canvas', baseImg);
    };

    // 7 SEGUNDOS NO SPLASH SCREEN
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      const sidebar = document.getElementById('sidebar-container');
      
      splash.style.opacity = '0';
      splash.style.visibility = 'hidden';
      sidebar.classList.add('active');
    }, 7000);

    // ALTERNÂNCIA DOS MENUS
    function selectNav(element) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
    }
  </script>
</body>
</html>
