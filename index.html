<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bull Protocol — High-Yield Momentum Trading Terminal" />
  <meta name="theme-color" content="#020409" />
  <title>Bull Protocol | High-Yield Momentum Terminal</title>

  <!-- OFFICIAL BULL PROTOCOL FAVICON (REMOVES V0 ICON) -->
  <link rel="icon" type="image/png" href="/bull-logo.png" />
  <link rel="shortcut icon" type="image/png" href="/bull-logo.png" />
  <link rel="apple-touch-icon" href="/bull-logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #020409;
      --cyan-neon: #00f0ff;
      --purple-neon: #c084fc;
      --magenta-neon: #d946ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* REMOVE ANY LEFTOVER V0 WATERMARKS OR BADGES */
    [class*="v0-badge"], [id*="v0-badge"], a[href*="v0.dev"], div[data-v0] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(0, 240, 255, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(2, 6, 23, 0.9) 0%, var(--bg-dark) 100%);
      background-attachment: fixed;
    }

    /* 1. BULL INTRO SPLASH SCREEN */
    #splash-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      cursor: pointer;
      transition: opacity 0.5s ease;
    }

    .splash-glow-core {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.35) 0%, rgba(192, 132, 252, 0.15) 45%, transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }

    .splash-logo-img {
      position: relative;
      width: 260px;
      max-width: 80vw;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 35px rgba(0, 240, 255, 0.9)) drop-shadow(0 0 70px rgba(0, 240, 255, 0.4));
      animation: pulseGlow 2s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      from { transform: scale(0.98); filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.7)); }
      to { transform: scale(1.02); filter: drop-shadow(0 0 45px rgba(0, 240, 255, 1)); }
    }

    .splash-text {
      margin-top: 24px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      letter-spacing: 0.3em;
      color: var(--cyan-neon);
      text-transform: uppercase;
      font-weight: 800;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
    }

    .splash-sub {
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* 2. MAIN APPLICATION LAYOUT */
    #app-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    #topbar {
      height: 68px;
      background: rgba(4, 7, 14, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-logo-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px #00f0ff);
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #ffffff;
      line-height: 1;
    }

    .brand-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.4em;
      color: var(--cyan-neon);
      margin-top: 3px;
    }

    .topbar-slogan {
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding-left: 18px;
    }

    .slogan-title {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.14em;
      background: linear-gradient(90deg, #00f0ff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .slogan-sub {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #64748b;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
