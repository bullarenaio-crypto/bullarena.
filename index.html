  <style>
    :root {
      --bg-dark: #020409;
      --cyan-neon: #00f0ff;
      --purple-neon: #c084fc;
      --magenta-neon: #d946ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ESCONDE QUALQUER MARCA D'ÁGUA OU BADGE DO V0 */
    [class*="v0-badge"], [id*="v0-badge"], a[href*="v0.dev"], div[data-v0] {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(0, 240, 255, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(2, 6, 23, 0.9) 0%, var(--bg-dark) 100%);
      background-attachment: fixed;
    }

    /* SPLASH SCREEN DO TOURO */
    #splash-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }

    .splash-glow-core {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.35) 0%, rgba(192, 132, 252, 0.15) 45%, transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }

    .splash-logo-img {
      position: relative;
      width: 280px;
      max-width: 80vw;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 35px rgba(0, 240, 255, 0.9)) drop-shadow(0 0 70px rgba(0, 240, 255, 0.4));
      animation: pulseGlow 2s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      from { transform: scale(0.98); filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.7)); }
      to { transform: scale(1.02); filter: drop-shadow(0 0 45px rgba(0, 240, 255, 1)); }
    }

    .splash-text {
      margin-top: 24px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      letter-spacing: 0.3em;
      color: var(--cyan-neon);
      text-transform: uppercase;
      font-weight: 800;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
    }

    /* APLICAÇÃO PRINCIPAL */
    #app-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    #topbar {
      height: 68px;
      background: rgba(4, 7, 14, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-logo-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px #00f0ff);
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #ffffff;
      line-height: 1;
    }

    .brand-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.4em;
      color: var(--cyan-neon);
      margin-top: 3px;
    }

    .topbar-slogan {
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding-left: 18px;
    }

    .slogan-title {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.14em;
      background: linear-gradient(90deg, #00f0ff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .slogan-sub {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #64748b;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .network-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #e2e8f0;
    }

    .solana-icon {
      width: 14px;
      height: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .solana-line {
      height: 2px;
      background: linear-gradient(90deg, #9945ff 0%, #14f195 100%);
      border-radius: 2px;
    }

    .raydium-icon {
      width: 16px;
      height: 16px;
      border: 1.5px solid #a855f7;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 900;
      color: #c084fc;
    }

    .status-online {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.45);
      font-size: 11px;
      font-weight: 800;
      color: #34d399;
    }

    .status-ring {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .wallet-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 10px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid #00f0ff;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      transition: all 0.2s ease;
    }

    .wallet-btn:hover {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
    }

    #main-body {
      display: flex;

    }

    #sidebar-container {

      display: flex;

      border-right: 1px solid rgba(0, 240, 255, 0.08);

    .sidebar-header {
      display: flex;

      padding: 0 6px 18px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);

    .sidebar-logo-img {

    .sidebar-brand-title {

      font-weight: 800;

      color: #ffffff;
      line-height: 1;
    }

    .sidebar-brand-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.38em;
      color: var(--cyan-neon);
      margin-top: 4px;
    }

    .nav-group {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      border: 1px solid transparent;
    }

    .nav-btn.selected {
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.3) 0%, rgba(0, 240, 255, 0.3) 100%);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);

    .nav-btn.selected .btn-title {
      color: #ffffff;

    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-text {

      flex-direction: column;
    }

    .btn-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #e2e8f0;
      text-transform: uppercase;

    .btn-subtitle {

      margin-top: 1px;
    }

    .card-wrapper {
      margin-top: 14px;
    }

    .rules-box {
      background: linear-gradient(180deg, rgba(8, 12, 24, 0.95) 0%, rgba(4, 7, 15, 0.98) 100%);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 16px;
      padding: 16px 14px;
      text-align: center;
    }

    .card-logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      margin: 0 auto 6px auto;
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.8));
    }

    .rule-title-magenta {
      font-size: 11px;

      color: var(--magenta-neon);
      display: inline-block;
    }

    .rule-title-cyan {
      font-size: 11px;
      font-weight: 900;
      color: var(--cyan-neon);
      display: inline-block;
      margin-left: 4px;
    }

    .rule-desc {
      font-size: 10px;
      line-height: 1.45;
      color: #94a3b8;
      margin: 8px 0 12px 0;
    }

    .btn-how-it-works {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 9px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-how-it-works:hover {

    }

    #content-container {

      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .arena-dashboard {
      width: 100%;
      max-width: 860px;
      background: linear-gradient(135deg, rgba(16, 12, 34, 0.95) 0%, rgba(5, 10, 24, 0.95) 100%);

      display: flex;

      align-items: center;
    }

    .fighter-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 190px;
      cursor: pointer;
    }

    .fighter-avatar-wrap {

      border-radius: 50%;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .wrap-shiba {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
    }

    .wrap-doge {
      background: linear-gradient(135deg, #00f0ff, #38bdf8);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
    }

    .fighter-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #000;
      object-fit: cover;
    }

    .fighter-name {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .shiba-text { color: #d8b4fe; }
    .doge-text { color: #38bdf8; }

    .fighter-stats {
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 600;
      margin-top: 4px;
    }

    .fighter-vol {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      margin-top: 2px;
    }

    .duel-center-col {
      display: flex;

    .active-tag {

      font-weight: 800;
      letter-spacing: 0.18em;
      padding: 4px 14px;
      border-radius: 12px;

      margin-bottom: 8px;
    }

    .duel-matchup-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .duel-matchup-title span {
      color: #94a3b8;
      font-size: 14px;

    }

    .duel-round-meta {
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 700;
    }

    .timer-digital-box {
      margin-top: 14px;
      background: rgba(2, 6, 18, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 12px;
      padding: 10px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-label {
      font-size: 9.5px;
      font-weight: 800;

      text-transform: uppercase;
    }

    .timer-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(0, 240, 255, 0.8);
      margin-top: 2px;
    }

    .battle-actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;

    .faction-card {

    .faction-title {

    }

    .badge-doge {

    }

    .faction-btn {
