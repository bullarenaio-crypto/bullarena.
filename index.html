<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bull Protocol | High-Yield Momentum Terminal</title>
  
  <!-- FAVICON OFICIAL DO BULL PROTOCOL (SUBSTITUI O ÍCONE DO V0) -->
  <link rel="icon" type="image/png" href="https://i.postimg.cc/kXMHjQJ2/bull-logo-png.png" />
  <link rel="shortcut icon" type="image/png" href="https://i.postimg.cc/kXMHjQJ2/bull-logo-png.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- SCRIPT SOLANA WEB3 OFICIAL PARA HTML PURO -->
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

  <style>
    :root {
      --bg-dark: #020409;
      --sidebar-bg: #050811;
      --cyan-neon: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.45);
      --purple-neon: #c084fc;
      --magenta-neon: #d946ef;
      --purple-glow: rgba(192, 132, 252, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(0, 240, 255, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(2, 6, 23, 0.9) 0%, var(--bg-dark) 100%);
      background-attachment: fixed;
    }

    /* 1. SPLASH SCREEN (7 SECONDS) */
    #splash-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    }

    .splash-glow-core {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.28) 0%, rgba(192, 132, 252, 0.12) 45%, transparent 70%);
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
    }

    #splash-canvas {
      position: relative;
      width: 290px;
      max-width: 85vw;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 35px rgba(0, 240, 255, 0.85)) drop-shadow(0 0 70px rgba(0, 240, 255, 0.35));
    }

    /* 2. MAIN APPLICATION */
    #app-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #app-layout.active {
      opacity: 1;
      visibility: visible;
    }

    /* TOPBAR */
    #topbar {
      height: 68px;
      background: rgba(4, 7, 14, 0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-logo-canvas {
      width: 38px;
      height: 38px;
      object-fit: contain;
      filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.7));
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #ffffff;
      line-height: 1;
    }

    .brand-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.4em;
      color: var(--cyan-neon);
      margin-top: 3px;
    }

    .topbar-slogan {
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding-left: 18px;
    }

    .slogan-title {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.14em;
      background: linear-gradient(90deg, #00f0ff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .slogan-sub {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #64748b;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .network-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #e2e8f0;
    }

    .solana-icon {
      width: 14px;
      height: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .solana-line {
      height: 2px;
      background: linear-gradient(90deg, #9945ff 0%, #14f195 100%);
      border-radius: 2px;
    }

    .raydium-icon {
      width: 16px;
      height: 16px;
      border: 1.5px solid #a855f7;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 900;
      color: #c084fc;
    }

    .status-online {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.45);
      font-size: 11px;
      font-weight: 800;
      color: #34d399;
    }

    .status-ring {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .wallet-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 15px;
      border-radius: 10px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      transition: all 0.2s ease;
    }

    .wallet-btn:hover {
      background: rgba(0, 240, 255, 0.18);
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
    }

    /* BODY */
    #main-body {
      display: flex;
      flex: 1;
    }

    /* SIDEBAR */
    #sidebar-container {
      width: 300px;
      min-width: 300px;
      background: #040712;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px 16px 18px 16px;
      border-right: 1px solid rgba(0, 240, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 6px 18px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .sidebar-logo-canvas {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px #00f0ff);
    }

    .sidebar-brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #ffffff;
      line-height: 1;
    }

    .sidebar-brand-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.38em;
      color: var(--cyan-neon);
      margin-top: 4px;
    }

    .nav-group {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      background: transparent;
      border: 1px solid transparent;
    }

    .nav-btn.selected {
      background: linear-gradient(90deg, rgba(168, 85, 247, 0.3) 0%, rgba(0, 240, 255, 0.3) 100%);
      border: 1px solid transparent;
      background-clip: padding-box;
      position: relative;
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.22);
    }

    .nav-btn.selected::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 12px;
      padding: 1px;
      background: linear-gradient(90deg, #c084fc, #00f0ff);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .nav-btn.selected .nav-icon svg {
      stroke: var(--cyan-neon);
      filter: drop-shadow(0 0 8px var(--cyan-neon));
    }

    .nav-btn.selected .btn-title {
      color: #ffffff;
      font-weight: 800;
    }

    .nav-btn:not(.selected):hover {
      background: rgba(255, 255, 255, 0.035);
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-icon svg {
      width: 100%;
      height: 100%;
      stroke: #718096;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.2s ease;
    }

    .nav-btn:not(.selected):hover .nav-icon svg {
      stroke: #cbd5e1;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
    }

    .btn-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #e2e8f0;
      text-transform: uppercase;
    }

    .btn-subtitle {
      font-size: 10px;
      color: #64748b;
      margin-top: 1px;
    }

    /* CARD DE REGRAS INFERIOR */
    .card-wrapper {
      position: relative;
      z-index: 2;
      margin-top: 14px;
    }

    .rules-box {
      background: linear-gradient(180deg, rgba(8, 12, 24, 0.95) 0%, rgba(4, 7, 15, 0.98) 100%);
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      border-radius: 16px;
      padding: 16px 14px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .card-logo-canvas {
      width: 34px;
      height: 34px;
      object-fit: contain;
      margin: 0 auto 6px auto;
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.8));
    }

    .rule-title-magenta {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--magenta-neon);
      display: inline-block;
    }

    .rule-title-cyan {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--cyan-neon);
      display: inline-block;
      margin-left: 4px;
    }

    .rule-title-row {
      margin-bottom: 6px;
    }

    .rule-desc {
      font-size: 10px;
      line-height: 1.45;
      color: #94a3b8;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .btn-how-it-works {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 9px;
      padding: 8px 0;
      color: var(--cyan-neon);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .btn-how-it-works:hover {
      background: rgba(0, 240, 255, 0.12);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    .neon-waves {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 90px;
      background: url('https://i.postimg.cc/4yNtpNzv/site.png') no-repeat bottom center;
      background-size: cover;
      opacity: 0.65;
      pointer-events: none;
      z-index: 1;
    }

    /* CENTRAL ARENA */
    #content-container {
      flex: 1;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      max-width: 100%;
    }

    .arena-dashboard {
      width: 100%;
      max-width: 860px;
      background: linear-gradient(135deg, rgba(16, 12, 34, 0.95) 0%, rgba(5, 10, 24, 0.95) 100%);
      border: 1.5px solid rgba(0, 240, 255, 0.35);
      border-radius: 18px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 240, 255, 0.12);
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .arena-glow-left {
      position: absolute;
      left: -40px;
      top: 50%;
      transform: translateY(-50%);
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }

    .arena-glow-right {
      position: absolute;
      right: -40px;
      top: 50%;
      transform: translateY(-50%);
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.35) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }

    .fighter-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
      width: 190px;
    }

    .fighter-avatar-wrap {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .wrap-shiba {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
    }

    .wrap-doge {
      background: linear-gradient(135deg, #00f0ff, #38bdf8);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
    }

    .fighter-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #000;
      object-fit: cover;
    }

    .fighter-name {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .shiba-text { color: #d8b4fe; }
    .doge-text { color: #38bdf8; }

    .fighter-stats {
      font-size: 11px;

    }

    .fighter-vol {

    }

    .duel-center-col {
      display: flex;

      align-items: center;
      text-align: center;
      z-index: 2;
    }

    .active-tag {
      background: rgba(0, 240, 255, 0.12);

      color: var(--cyan-neon);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;

      border-radius: 12px;

    }

    .duel-matchup-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;

      letter-spacing: 0.08em;
    }

    .duel-matchup-title span {
      color: #94a3b8;

      margin: 0 6px;

    }

    .duel-round-meta {

      text-transform: uppercase;

    }

    .timer-digital-box {
      margin-top: 14px;
      background: rgba(2, 6, 18, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 12px;

      display: flex;

    .timer-label {
      font-size: 9.5px;

    }

    .timer-clock {
      font-family: 'JetBrains Mono', monospace;

      text-shadow: 0 0 18px rgba(0, 240, 255, 0.8);

    }

    .battle-actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      width: 100%;
      max-width: 860px;
    }

    .faction-card {
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .faction-shiba {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.14) 0%, rgba(8, 10, 22, 0.94) 100%);
      border: 1px solid rgba(168, 85, 247, 0.35);
    }

    .faction-doge {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.13) 0%, rgba(6, 11, 24, 0.94) 100%);
      border: 1px solid rgba(0, 240, 255, 0.35);
    }

    .faction-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
